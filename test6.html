<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>點餐系統示範</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        /* 結帳視窗背景 (黑色半透明) */
        #checkoutModal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        /* 結帳視窗內容 */
        #checkoutBox {
            background: white;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        #closeBtn {
            margin-top: 20px;
            padding: 8px 16px;
            background: gray;
            color: white;
            border: none;
            cursor: pointer;
        }

        #orderBtn {
            margin-top: 10px;
            padding: 10px 24px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h2>❤️ 點餐系統</h2>

<h3>商品：嘉明套餐：鍋燒意麵+冬瓜檸檬（單價 100 元）</h3>
<label>請輸入數量：</label>
<input type="number" id="qty" min="1" value="1">
<br><br>

<button id="orderBtn">加入購物車</button>

<!-- 結帳彈出視窗 -->
<div id="checkoutModal">
    <div id="checkoutBox">
        <h3>結帳明細</h3>
        <p id="detail"></p>
        <button id="closeBtn">關閉視窗</button>
    </div>
</div>

<script>
// 結帳按鈕
document.getElementById("orderBtn").addEventListener("click", function() {
    let qty = Number(document.getElementById("qty").value);
    let price = 80;
    let total = qty * price;

    // 顯示結帳內容
    document.getElementById("detail").innerHTML =
        "漢堡 x " + qty + "<br>總金額：" + total + " 元";

    // 顯示彈窗
    document.getElementById("checkoutModal").style.display = "flex";
});

// 關閉視窗按鈕
document.getElementById("closeBtn").addEventListener("click", function() {
    document.getElementById("checkoutModal").style.display = "none";
});
</script>

</body>
</html>
