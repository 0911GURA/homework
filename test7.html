<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>❤阿冰姐の點餐系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>❤阿冰姐の點餐系統</h1>
  <p>請選擇您要的商品與數量：</p>
</header>

<div class="category-buttons">
  <button data-cat="bing">刨冰</button>
  <button data-cat="snow">雪花冰</button>
  <button data-cat="tofu">豆花</button>
  <button data-cat="hot">熱食</button>
  <button data-cat="drink">飲料</button>
  <button data-cat="special">秋冬限定/其他</button>
</div>

<main>
<!-- 🍧 刨冰 -->
<section class="menu-section" id="bing">
  <h2>🍧 刨冰</h2>

  <div class="menu-item">
    <span class="item-name">紅豆牛奶冰</span>
    <span class="item-price">$65</span>
    <div class="qty-control">
      <button class="minus">-</button>
      <input type="number" min="0" value="0">
      <button class="plus">+</button>
    </div>
  </div>

  <div class="menu-item">
    <span class="item-name">綠豆牛奶冰</span>
    <span class="item-price">$65</span>
    <div class="qty-control">
      <button class="minus">-</button>
      <input type="number" min="0" value="0">
      <button class="plus">+</button>
    </div>
  </div>

  <div class="menu-item">
    <span class="item-name">芋頭牛奶冰</span>
    <span class="item-price">$65</span>
    <div class="qty-control">
      <button class="minus">-</button>
      <input type="number" min="0" value="0">
      <button class="plus">+</button>
    </div>
  </div>
</section>

<!-- ❄ 雪花冰 -->
<section class="menu-section" id="snow">
  <h2>❄ 雪花冰</h2>

  <div class="menu-item">
    <span class="item-name">巧克力雪花冰</span>
    <span class="item-price">$55</span>
    <div class="qty-control">
      <button class="minus">-</button>
      <input type="number" min="0" value="0">
      <button class="plus">+</button>
    </div>
  </div>

  <div class="menu-item">
    <span class="item-name">草莓醬雪花冰</span>
    <span class="item-price">$55</span>
    <div class="qty-control">
      <button class="minus">-</button>
      <input type="number" min="0" value="0">
      <button class="plus">+</button>
    </div>
  </div>
</section>

<!-- 🍮 豆花 -->
<section class="menu-section" id="tofu">
  <h2>🍮 豆花</h2>

  <div class="menu-item">
    <span class="item-name">芋頭豆花</span>
    <span class="item-price">$40</span>
    <div class="qty-control">
      <button class="minus">-</button>
      <input type="number" min="0" value="0">
      <button class="plus">+</button>
    </div>
  </div>
</section>

<!-- 🛒 購物車 -->
<aside class="cart-container">
  <h2>🛒 用餐方式</h2>
  <label><input type="radio" name="dine" value="內用" checked> 內用</label><br>
  <label><input type="radio" name="dine" value="外帶"> 外帶</label>

  <hr>

  <h3>🧾 已點商品</h3>
  <ul id="cartList"></ul>

  <p id="dineType">用餐方式：內用</p>
  <p id="totalPrice">總金額：$0</p>

  <button id="confirmBtn">確認訂單</button>
  <button id="clearBtn">清空全部</button>
</aside>
</main>

<footer>
  <p>❤️ 系統製作</p>
</footer>

<script>
const items = document.querySelectorAll('.menu-item');
const cartList = document.getElementById('cartList');
const totalPriceEl = document.getElementById('totalPrice');
const dineTypeEl = document.getElementById('dineType');
const clearBtn = document.getElementById('clearBtn');
const confirmBtn = document.getElementById('confirmBtn');
const dineRadios = document.querySelectorAll('input[name="dine"]');
const categoryBtns = document.querySelectorAll('.category-buttons button');
const sections = document.querySelectorAll('.menu-section');

function getDineType() {
  return document.querySelector('input[name="dine"]:checked').value;
}

function updateCart() {
  cartList.innerHTML = '';
  let total = 0;

  items.forEach(item => {
    const name = item.querySelector('.item-name').innerText;
    const price = Number(item.querySelector('.item-price').innerText.replace('$',''));
    const input = item.querySelector('input');
    const qty = Number(input.value) || 0;

    if (qty > 0) {
      const li = document.createElement('li');
      li.textContent = `${name} × ${qty} = $${price * qty}`;
      cartList.appendChild(li);
      total += price * qty;
    }
  });

  dineTypeEl.textContent = `用餐方式：${getDineType()}`;
  totalPriceEl.textContent = `總金額：$${total}`;
}

// 數量控制
items.forEach(item => {
  const input = item.querySelector('input');
  item.querySelector('.plus').onclick = () => {
    input.value++;
    updateCart();
  };
  item.querySelector('.minus').onclick = () => {
    input.value = Math.max(0, input.value - 1);
    updateCart();
  };
});

// 用餐方式
dineRadios.forEach(r => r.addEventListener('change', updateCart));

// 清空
clearBtn.onclick = () => {
  items.forEach(item => {
    item.querySelector('input').value = 0;
    item.querySelector('input').disabled = false;
    item.querySelector('.plus').disabled = false;
    item.querySelector('.minus').disabled = false;
  });
  cartList.innerHTML = '';
  totalPriceEl.textContent = '總金額：$0';
  confirmBtn.disabled = false;
  confirmBtn.innerText = '確認訂單';
};

// 確認訂單
confirmBtn.onclick = () => {
  let summary = '';
  let total = 0;
  let hasItem = false;

  items.forEach(item => {
    const name = item.querySelector('.item-name').innerText;
    const price = Number(item.querySelector('.item-price').innerText.replace('$',''));
    const input = item.querySelector('input');
    const qty = Number(input.value) || 0;

    if (qty > 0) {
      hasItem = true;
      summary += `${name} × ${qty} = $${price * qty}\n`;
      total += price * qty;

      // 鎖定
      input.disabled = true;
      item.querySelector('.plus').disabled = true;
      item.querySelector('.minus').disabled = true;
    }
  });

  if (!hasItem) {
    alert('⚠️ 請先選擇商品');
    return;
  }

  summary += `\n----------------\n`;
  summary += `總金額：$${total}\n`;
  summary += `用餐方式：${getDineType()}`;

  alert(summary);

  confirmBtn.disabled = true;
  confirmBtn.innerText = '✅ 訂單已確認';
};


// 分類切換
categoryBtns.forEach(btn => {
  btn.onclick = () => {
    sections.forEach(sec => sec.style.display = 'none');
    document.getElementById(btn.dataset.cat).style.display = 'block';
  };
});

// 初始
sections.forEach(sec => sec.style.display = 'none');
document.getElementById('bing').style.display = 'block';
</script>

</body>
</html>
