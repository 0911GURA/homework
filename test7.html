<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>❤阿冰姐の點餐系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>❤阿冰姐の點餐系統</h1>
  <p>請選擇您要的商品與數量：</p>
</header>

<div class="category-buttons">
  <button data-cat="bing">刨冰</button>
  <button data-cat="snow">雪花冰</button>
  <button data-cat="tofu">豆花</button>
  <button data-cat="hot">熱食</button>
  <button data-cat="drink">飲料</button>
  <button data-cat="special">秋冬限定/其他</button>
</div>

<main>
  <!-- 刨冰 -->
  <section class="menu-section" id="bing">
    <h2>🍧 刨冰</h2>
    <div class="menu-item">
      <span class="item-name">紅豆牛奶冰</span>
      <span class="item-price">$65</span>
      <div class="qty-control">
        <button class="minus">-</button>
        <input type="number" min="0" value="0">
        <button class="plus">+</button>
      </div>
    </div>
  </section>

  <!-- 雪花冰 -->
  <section class="menu-section" id="snow">
    <h2>❄ 雪花冰</h2>
    <div class="menu-item">
      <span class="item-name">巧克力雪花冰</span>
      <span class="item-price">$55</span>
      <div class="qty-control">
        <button class="minus">-</button>
        <input type="number" min="0" value="0">
        <button class="plus">+</button>
      </div>
    </div>
  </section>

  <!-- 豆花 -->
  <section class="menu-section" id="tofu">
    <h2>🍮 豆花</h2>
    <div class="menu-item">
      <span class="item-name">芋頭豆花</span>
      <span class="item-price">$40</span>
      <div class="qty-control">
        <button class="minus">-</button>
        <input type="number" min="0" value="0">
        <button class="plus">+</button>
      </div>
    </div>
  </section>

  <!-- 購物車 -->
  <aside class="cart-container">
    <h2>🛒 用餐方式</h2>
    <label><input type="radio" name="dine" value="內用" checked> 內用</label><br>
    <label><input type="radio" name="dine" value="外帶"> 外帶</label>

    <hr>

    <h3>🧾 已點商品</h3>
    <ul id="cartList"></ul>

    <p id="dineType">用餐方式：內用</p>
    <p id="totalPrice">總金額：$0</p>

    <button id="confirmBtn">確認訂單</button>
    <button id="clearBtn">清空全部</button>
  </aside>
</main>

<footer>
  <p>❤️ 系統製作</p>
</footer>

<script>
const items = document.querySelectorAll('.menu-item');
const cartList = document.getElementById('cartList');
const totalPriceEl = document.getElementById('totalPrice');
const dineTypeEl = document.getElementById('dineType');
const clearBtn = document.getElementById('clearBtn');
const confirmBtn = document.getElementById('confirmBtn');
const dineRadios = document.querySelectorAll('input[name="dine"]');
const categoryBtns = document.querySelectorAll('.category-buttons button');
const sections = document.querySelectorAll('.menu-section');

function getDineType() {
  return document.querySelector('input[name="dine"]:checked').value;
}

function updateCart() {
  cartList.innerHTML = '';
  let total = 0;

  items.forEach(item => {
    const name = item.querySelector('.item-name').innerText;
    const price = parseInt(item.querySelector('.item-price').innerText.replace('$', ''));
    const input = item.querySelector('input');
    let qty = parseInt(input.value);

    if (qty < 0 || isNaN(qty)) {
      qty = 0;
      input.value = 0;
    }

    if (qty > 0) {
      const li = document.createElement('li');
      li.textContent = `${name} × ${qty} = $${price * qty}`;
      cartList.appendChild(li);
      total += price * qty;
    }
  });

  dineTypeEl.textContent = `用餐方式：${getDineType()}`;
  totalPriceEl.textContent = `總金額：$${total}`;
}

// 數量輸入框變化
items.forEach(item => {
  const input = item.querySelector('input');
  input.addEventListener('input', updateCart);

  const plusBtn = item.querySelector('.plus');
  const minusBtn = item.querySelector('.minus');

  plusBtn.addEventListener('click', () => {
    input.value = parseInt(input.value) + 1;
    updateCart();
  });

  minusBtn.addEventListener('click', () => {
    input.value = Math.max(0, parseInt(input.value) - 1);
    updateCart();
  });
});

// 用餐方式變化
dineRadios.forEach(radio => {
  radio.addEventListener('change', updateCart);
});

// 清空全部
clearBtn.addEventListener('click', () => {
  items.forEach(item => item.querySelector('input').value = 0);
  updateCart();
});

// 確認訂單
confirmBtn.addEventListener('click', () => {
  if (cartList.children.length === 0) {
    alert('⚠️ 請先選擇商品');
    return;
  }

  let text = `🍧 阿冰姐點餐系統\n-----------------\n用餐方式：${getDineType()}\n\n`;
  cartList.querySelectorAll('li').forEach(li => text += li.textContent + '\n');
  text += `\n${totalPriceEl.textContent}\n\n❤️ 訂單已送出，請稍候`;
  alert(text);
});

// 切換分類
categoryBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    sections.forEach(sec => sec.style.display = sec.id === cat ? 'block' : 'none');
  });
});

// 初始只顯示刨冰
sections.forEach(sec => sec.style.display = 'none');
document.getElementById('bing').style.display = 'block';
</script>

</body>
</html>
