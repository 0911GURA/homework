<!DOCTYPE html>
<html>
<body><p id="clock"></p>
<script>
window.addEventListener("load", function(){
setInterval(display, 1000);
});
function display(){
let date = new Date();
let hour = date.getHours();
let min = date.getMinutes();
let sec = date.getSeconds();
document.getElementById("clock").innerHTML = hour + ": " + min + ": " + sec;
}
</script></body></html>
