<!DOCTYPE html>
<html>
<style>
.animate {
width: 1px; height: 1px; position: absolute; background: blue;
}
</style>
<body>
<script>
for (variable=1;variable<=100000000000000;variable=variable+1) {
let x = Math.floor((Math.random() * 400) + 1);
let y = Math.sqrt(160000-x*x) - Math.floor((Math.random() * 400) + 1);
let elem = document.createElement("div");
elem.setAttribute("class", "animate");
elem.style.left = x + "px";
elem.style.top = y + "px";
document.body.appendChild(elem);
}
</script></body></html>
